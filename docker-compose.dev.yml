version: "3.9"
# Development override 鈥?run infra only, dev servers locally
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: conjiweb-postgres-dev
    environment:
      POSTGRES_DB: conjiweb
      POSTGRES_USER: conjiweb
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: conjiweb-redis-dev
    command: redis-server --requirepass changeme
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  minio:
    image: minio/minio:latest
    container_name: conjiweb-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: changeme123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

  prosody:
    image: prosody/prosody:0.12
    container_name: conjiweb-prosody-dev
    volumes:
      - ./infra/prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - prosody_dev_data:/var/lib/prosody
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5280:5280"

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  prosody_dev_data:
